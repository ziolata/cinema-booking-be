name: Deploy to Server

on:
  push:
    branches:
      - main  # hoặc 'dev' nếu bạn muốn deploy nhánh dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no administrator@$DEPLOY_HOST '
            cd C:/app/CinemaBooking &&
            git reset --hard &&
            git pull cinema main &&
            pm2 restart all
          '
